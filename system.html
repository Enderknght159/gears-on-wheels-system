<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f6f3">
<title>مستند محمي — Gears on Wheels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f6f3;--surface:#eaeae5;--ink:#111;--ink-soft:#2b2b29;--muted:#6d6d69;--line:#dcdcd6;
    --purple:#7546f0;--red:#f0453a;
    --grad:linear-gradient(90deg,#8e50f9,#b44cbb 16%,#d8486f 33%,#ee4b3e 48%,#f0902f 62%,#e9c93c 76%,#a9cd52 88%,#41b56e);
    --ar:"Alexandria","Segoe UI",sans-serif;--en:"Poppins","Segoe UI",sans-serif;
    --ease:cubic-bezier(.2,.75,.25,1)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);-webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:28px 20px;position:relative;overflow:hidden}
  body::before{content:"";position:fixed;inset-block-start:0;inset-inline:0;height:3px;background:var(--grad);z-index:3}
  .aura{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0}
  .a1{width:min(60vw,680px);aspect-ratio:1;inset-block-start:-18%;inset-inline-start:-8%;
    background:radial-gradient(circle,rgba(142,80,249,.16),transparent 68%);animation:drift 24s ease-in-out infinite alternate}
  .a2{width:min(50vw,520px);aspect-ratio:1;inset-block-end:-22%;inset-inline-end:-6%;
    background:radial-gradient(circle,rgba(240,138,44,.13),transparent 68%);animation:drift 30s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(3%,-4%,0) scale(1.08)}}
  .card{position:relative;z-index:2;width:min(420px,100%);background:#fff;border-radius:24px;
    padding:38px 34px 30px;box-shadow:0 40px 90px -60px rgba(17,17,17,.55),0 1px 0 rgba(17,17,17,.04);
    animation:in .7s var(--ease) both}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .wordmark{text-align:center;font-family:var(--en);direction:ltr;font-weight:600;font-size:1rem;
    letter-spacing:-.02em;margin-bottom:22px}
  .wordmark i{font-style:normal;color:var(--purple)}
  .kick{font-family:var(--en);font-size:.62rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:var(--purple);text-align:center;direction:ltr}
  h1{font-size:1.18rem;font-weight:700;text-align:center;margin:10px 0 6px;letter-spacing:-.01em}
  .sub{font-size:.79rem;color:var(--muted);text-align:center;line-height:1.8;margin:0 0 22px}
  .doc{display:flex;justify-content:center;margin-bottom:18px}
  .doc span{font-size:.66rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    padding:3px 11px;border-radius:99px}
  label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:6px}
  .field{position:relative}
  input{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;background:#fff;
    padding:0 44px 0 14px;font-family:var(--en);font-size:.95rem;letter-spacing:.12em;color:var(--ink);
    outline:none;transition:border-color .2s,box-shadow .2s;direction:ltr;text-align:center}
  input::placeholder{letter-spacing:.2em;color:#bdbdb7}
  input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(117,70,240,.12)}
  input.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(240,69,58,.1)}
  .eye{position:absolute;inset-block-start:0;inset-inline-end:6px;height:46px;width:36px;display:grid;place-items:center;
    color:#9a9a95;background:none;border:0;cursor:pointer;border-radius:10px}
  .eye:hover{color:var(--ink)}
  .btn{width:100%;height:46px;margin-top:12px;border:0;border-radius:13px;background:var(--ink);color:var(--bg);
    font-family:var(--ar);font-size:.84rem;font-weight:600;cursor:pointer;transition:background .25s,transform .15s;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{background:var(--purple)}
  .btn:active{transform:scale(.99)}
  .btn[disabled]{opacity:.7;cursor:default}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
    animation:sp .7s linear infinite;display:none}
  .btn.loading .spin{display:block}
  .btn.loading .txt{opacity:.8}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{min-height:20px;margin-top:10px;font-size:.73rem;color:#b62c24;text-align:center}
  .shake{animation:sh .4s var(--ease)}
  @keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;gap:10px;font-family:var(--en);font-size:.6rem;letter-spacing:.14em;
    text-transform:uppercase;color:#9a9a95}
  .foot svg{width:11px;height:11px}
  @media (max-height:620px){body{align-items:start;padding-top:36px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aura a1"></div><div class="aura a2"></div>
<main class="card" id="card">
  <div class="wordmark">Gears<i>·</i>on<i>·</i>Wheels</div>
  <div class="kick">Private access</div>
  <h1>هذا المستند محمي</h1>
  <p class="sub">أدخل كلمة المرور للمتابعة.</p>
  <div class="doc"><span>العرض التفاعلي — النظام</span></div>
  <label for="pw">كلمة المرور</label>
  <div class="field">
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••••" autofocus>
    <button class="eye" type="button" id="eye" aria-label="إظهار كلمة المرور">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <button class="btn" id="go" type="button"><span class="spin"></span><span class="txt">فتح</span></button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot"><span>Gears on Wheels</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>
</main>

const ITER = 210000;
const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pwEl = document.getElementById('pw');
const errEl = document.getElementById('err');
const btn = document.getElementById('go');
const card = document.getElementById('card');
let busy = false;

document.getElementById('eye').addEventListener('click', () => {
  pwEl.type = pwEl.type === 'password' ? 'text' : 'password';
  pwEl.focus();
});

async function unlock(){
  if (busy) return;
  const pw = pwEl.value.trim();
  if (!pw) { fail('أدخل كلمة المرور'); return; }
  busy = true; btn.classList.add('loading'); btn.disabled = true; errEl.textContent = ''; pwEl.classList.remove('bad');
  try{
    const blob = dec(B64);
    const salt = blob.slice(0,16), iv = blob.slice(16,28), data = blob.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations: ITER, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
    const html = new TextDecoder().decode(plain);
    card.style.transition = 'opacity .35s ease, transform .35s ease';
    card.style.opacity = '0'; card.style.transform = 'translateY(-8px)';
    setTimeout(() => { document.open(); document.write(html); document.close(); }, 300);
  }catch(e){
    busy = false; btn.classList.remove('loading'); btn.disabled = false;
    fail('كلمة المرور غير صحيحة');
  }
}

function fail(msg){
  errEl.textContent = msg;
  pwEl.classList.add('bad');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  pwEl.select();
}

btn.addEventListener('click', unlock);
pwEl.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
})();
</script>
